[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pymolviz"
version = "1.3.2"
description = "Library to facilitate creation of PyMOL Vizualizations."
readme = { text = "See https://github.com/Finnem/PyMolViz for a detailed documentation.", content-type = "text/plain" }
license = { text = "MIT" }
authors = [{ name = "Finn Mier" }]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "pandas",
    "cmap",
    "tqdm",
    "seaborn",
]

[project.urls]
Homepage = "https://github.com/Finnem/PyMolViz"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["pymolviz*"]
