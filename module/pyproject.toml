[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pymolviz"
version = "2.0.0"
description = "Library to facilitate creation of PyMOL Vizualizations."
readme = { text = "See https://github.com/Finnem/PyMolViz for a detailed documentation.", content-type = "text/plain" }
license = { text = "MIT" }
authors = [{ name = "Finn Mier" }]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "cmap",
]

[project.urls]
Homepage = "https://github.com/Finnem/PyMolViz"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
# MTZ maps and some crystal helpers (grid_from_mtz, space groups).
mtz = [
    "gemmi",
]
# Faster volumetric sampling when a CUDA GPU is available.
gpu = [
    "cupy",
]

[tool.setuptools.packages.find]
include = ["pymolviz*"]
